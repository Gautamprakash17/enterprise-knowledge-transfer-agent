[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-transfer-agent"
version = "1.0.0"
description = "Enterprise Knowledge Transfer Agent - RAG + LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Team" }]
dependencies = [
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.20",
    "langchain-text-splitters>=0.0.1",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
    "faiss-cpu>=1.7.4",
    "pypdf>=4.0.0",
    "slowapi>=0.1.9",
    "requests>=2.31.0",
    "flashrank>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
confluence = ["atlassian-python-api>=3.41.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "black", "mypy", "ruff"]
eval = ["ragas>=0.1.0", "datasets>=2.14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]
