services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VECTOR_STORE_PATH=/app/data/faiss_index
      - ENABLE_RBAC=${ENABLE_RBAC:-false}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Optional load balancer — enable with docker-compose.scale.yml:
  #   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --scale api=2
